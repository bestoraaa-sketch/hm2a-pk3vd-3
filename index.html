<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎂</title>
  


  <!-- ✏️ 替換成 Playpen Sans： -->
<link href="https://fonts.googleapis.com/css2?family=Just+Me+Again+Down+Here&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f8fafc;
      background-image: radial-gradient(#e2e8f0 1px, transparent 1px);
      background-size: 20px 20px;
    font-family: 'Just Me Again Down Here', cursive, -apple-system, sans-serif;
      padding: 20px;
    }

    /* 日記本外觀 */
    .journal-cover {
      background: #ffffff;
      padding: 35px 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08), 0 2px 6px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
      border-left: 14px solid #cbd5e1;
      max-width: 480px; /* 調整寬度，維持質感比例 */
      width: 100%;
      text-align: center;
      position: relative;
    }

    .journal-title {
      font-size: 32px;
      color: #334155;
      margin-bottom: 6px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: #64748b;
      font-size: 20px;
      margin-bottom: 20px;
    }

    .hint-text {
      color: #64748b;
      font-size: 20px;
      margin-bottom: 15px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 10px 15px;
      border-radius: 8px;
      border: 1.5px solid #cbd5e1;
      background: #fafafa;
      color: #1e293b;
      font-size: 22px;
      font-family: 'Caveat', cursive, sans-serif;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: #94a3b8;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.15);
    }

    .btn {
      width: 100%;
      padding: 10px;
      background: #475569;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 22px;
      font-family: 'Caveat', cursive, sans-serif;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: #334155;
    }

    #errorMsg {
      color: #e11d48;
      font-size: 18px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="journal-cover">
    <!-- 上傳在 GitHub 的封面圖片 (原圖尺寸顯示，不限大小) -->
    <img src="2.jpeg" alt="Journal Cover" style="max-width: 100%; height: auto; margin-bottom: 15px;">
    
    <h1 class="journal-title">Our Memory Journal</h1>
    <p class="subtitle">A little birthday story for you</p>
    
    <!-- 提示與輸入框 -->
    <p class="hint-text">提示是: try to input something!🌟</p>

    <div class="input-group">
      <input type="text" id="passwordInput" placeholder="請輸入密碼..." autocomplete="off">
    </div>
    
    <button class="btn" onclick="checkPassword()">打開日記本 ✨</button>
    <p id="errorMsg">❌ 密碼不正確，再試一次？</p>
  </div>

  <script>
    // 正確密碼設為 7
    const CORRECT_PASSWORD = "7"; 

    function checkPassword() {
      const userVal = document.getElementById('passwordInput').value.trim();
      const error = document.getElementById('errorMsg');

      if (userVal === CORRECT_PASSWORD) {
        alert('🔓 密碼正確！正在翻開日記本...');
        // 未來在這裡加入進入故事內頁的邏輯
      } else {
        error.style.display = 'block';
      }
    }
  </script>

</body>
</html>
