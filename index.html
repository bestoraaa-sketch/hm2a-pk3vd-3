<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>.... .- .--. .. / -... -.. .- -.-- / .--. .-. .. -. -.-. .</title>
  
  <!-- Single Day 字體引入 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Single+Day&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  /* 黑色背景 + 極暗灰點陣 */
  background-color: #000000;
  background-image: radial-gradient(#1e293b 1px, transparent 1px);
  background-size: 20px 20px;
  font-family: 'Single Day', cursive, -apple-system, sans-serif;
  padding: 20px;
}
    /* 日記本外觀 (深色模式) */
    .journal-cover {
      background: #1e293b;
      padding: 35px 40px;
      border-radius: 12px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
      border-left: 14px solid #475569; /* 深色質感書脊 */
      max-width: 480px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    .journal-title {
      font-size: 32px;
      color: #f8fafc;
      margin-bottom: 6px;
      font-weight: normal;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 20px;
      margin-bottom: 20px;
    }

    .hint-text {
      color: #cbd5e1;
      font-size: 20px;
      margin-bottom: 15px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 10px 15px;
      border-radius: 8px;
      border: 1.5px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 22px;
      font-family: 'Single Day', cursive, sans-serif;
      text-align: center;
      outline: none;
      transition: all 0.2s ease;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      border-color: #38bdf8; /* 淡藍色 Glow 聚焦效果 */
      background: #0f172a;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .btn {
      width: 100%;
      padding: 10px;
      background: #38bdf8; /* 亮眼淡藍色按鈕 */
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-size: 22px;
      font-family: 'Single Day', cursive, sans-serif;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: #7dd3fc;
    }

    .btn:active {
      transform: scale(0.98);
    }

    #errorMsg {
      color: #fb7185;
      font-size: 18px;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="journal-cover">
    <!-- 封面圖片 (2.jpeg) -->
    <img src="2.jpeg" alt="Journal Cover" style="max-width: 100%; height: auto; margin-bottom: 15px; border-radius: 6px;">
    
    <div class="input-group">
      <input type="text" id="passwordInput" placeholder="try to input something.." autocomplete="off">
    </div>
    
    <button class="btn" onclick="checkPassword()">打開日記本 ✨</button>
    <p id="errorMsg">❌ 密碼不正確，再試一次？</p>
  </div>

  <script>
    // 正確密碼設為 7
    const CORRECT_PASSWORD = "7"; 

    function checkPassword() {
      const userVal = document.getElementById('passwordInput').value.trim();
      const error = document.getElementById('errorMsg');

      if (userVal === CORRECT_PASSWORD) {
        alert('🔓 密碼正確！正在翻開日記本...');
        // 未來在這裡加入進入故事內頁的邏輯
      } else {
        error.style.display = 'block';
      }
    }
  </script>

</body>
</html>
